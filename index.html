<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rated</title>
<style>:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #fafafa; color: #1a1a1a;
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.bar {
  position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center; padding: 12px 20px; background: rgba(250,250,250,.9);
  backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid #e6e6e6;
}
.bar .home { font-weight: 800; color: #FFB800; text-decoration: none; margin-right: auto; letter-spacing: -.3px; }
.lang-btn {
  border: 1px solid #ddd; background: #fff; color: #555; border-radius: 8px;
  padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.lang-btn.active { background: #FFB800; border-color: #FFB800; color: #1a1a1a; }
main { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: 28px; letter-spacing: -.5px; margin: 8px 0 18px; }
h2 { font-size: 19px; letter-spacing: -.2px; margin: 32px 0 10px; }
p, li { color: #2b2b2b; }
a { color: #C77800; }
ul { padding-left: 20px; }
li { margin: 4px 0; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
th, td { border: 1px solid #e2e2e2; padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: #f0f0f0; font-weight: 700; }
.doc[hidden] { display: none; }
@media (prefers-color-scheme: dark) {
  body { background: #0f0f10; color: #eaeaea; }
  .bar { background: rgba(15,15,16,.9); border-bottom-color: #262626; }
  .lang-btn { background: #1c1c1e; border-color: #333; color: #aaa; }
  .lang-btn.active { background: #FFB800; border-color: #FFB800; color: #0f0f10; }
  p, li { color: #d6d6d6; }
  a { color: #FFCD4D; }
  th, td { border-color: #2c2c2e; }
  th { background: #1c1c1e; }
}
.hero { max-width: 560px; margin: 18vh auto 0; padding: 0 24px; text-align: center; }
.hero h1 { font-size: 40px; color: #FFB800; }
.hero p { color: #6a6a6a; margin-bottom: 28px; }
.links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.links a { display: inline-block; padding: 12px 20px; border: 1px solid #ddd; border-radius: 12px; text-decoration: none; font-weight: 700; color: #1a1a1a; }
@media (prefers-color-scheme: dark){ .links a{ color:#eaeaea; border-color:#333; } .hero p{ color:#9a9a9a; } }
</style>
</head>
<body>
<div class="hero">
  <h1>Rated</h1>
  <p>Rate or skip — la app de citas donde te valoran del 1 al 10.</p>
  <div class="links">
    <a href="/privacy">Política de Privacidad</a>
    <a href="/terms">Términos de Servicio</a>
  </div>
</div>
</body>
</html>
